name: Windows Build

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/windows-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Download sing-box (windows-amd64)
        shell: pwsh
        run: |
          $v = "1.11.3"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$v/sing-box-$v-windows-amd64.zip" -OutFile "$env:RUNNER_TEMP\sb.zip"
          Expand-Archive "$env:RUNNER_TEMP\sb.zip" -DestinationPath "$env:RUNNER_TEMP\sb"
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\sb" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "client/src-tauri/resources/sing-box.exe"

      - name: Download geoip & geosite
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/SagerNet/sing-geoip/releases/latest/download/geoip.db" -OutFile "client/src-tauri/resources/geoip.db"
          Invoke-WebRequest "https://github.com/SagerNet/sing-geosite/releases/latest/download/geosite.db" -OutFile "client/src-tauri/resources/geosite.db"

      - name: Build Tauri app (NSIS only)
        working-directory: client
        env:
          TAURI_BUNDLE_TARGETS: nsis
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-shell-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
